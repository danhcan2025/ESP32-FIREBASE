<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ESP32-C3 Smart Home AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; padding-bottom: 90px; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .nav-item.active { color: #2563eb; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        .ai-glow { box-shadow: 0 0 20px rgba(37, 99, 235, 0.2); border: 1px solid rgba(37, 99, 235, 0.1); }
    </style>
</head>
<body class="p-4 flex flex-col items-center">

    <div class="w-full max-w-md mb-6 flex justify-between items-end px-1">
        <div>
            <h1 class="text-2xl font-black text-slate-900 leading-tight">Smart AI Home</h1>
            <p class="text-slate-400 text-[10px] font-bold tracking-widest uppercase">ESP32-C3 • 4 Kênh GPIO</p>
        </div>
        <div id="status-badge" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-white text-slate-400 text-[9px] font-black border border-slate-200 shadow-sm transition-all duration-500">
            <div id="status-dot" class="w-1.5 h-1.5 rounded-full bg-slate-300"></div> 
            <span id="status-text">ĐANG KẾT NỐI</span>
        </div>
    </div>

    <main id="tab-control" class="tab-content active w-full max-w-md space-y-4">
        <div class="glass ai-glow p-4 rounded-[2rem] mb-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center text-white shrink-0 shadow-lg">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                </div>
                <input type="text" id="ai-input" placeholder="Hỏi AI... (VD: Bật đèn 1)" class="flex-1 bg-transparent border-none outline-none text-xs font-semibold text-slate-700">
                <button id="btn-ai-send" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500">
                    <i class="fa-solid fa-paper-plane text-[10px]"></i>
                </button>
            </div>
        </div>

        <div id="device-list" class="grid grid-cols-4 gap-2">
            <!-- Sẽ được populate bởi JS -->
            <div class="animate-pulse bg-white h-24 rounded-3xl"></div>
            <div class="animate-pulse bg-white h-24 rounded-3xl"></div>
            <div class="animate-pulse bg-white h-24 rounded-3xl"></div>
            <div class="animate-pulse bg-white h-24 rounded-3xl"></div>
        </div>
    </main>

    <section id="tab-schedule" class="tab-content w-full max-w-md">
        <div class="flex justify-between items-center mb-4 px-1">
            <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Hẹn giờ tự động</h2>
            <button class="bg-blue-600 text-white px-4 py-2 rounded-xl text-[10px] font-black shadow-lg">THÊM LỊCH</button>
        </div>
        <div id="schedule-list" class="space-y-2">
            <div class="text-center py-10 text-slate-300 text-xs italic">Đang tải lịch trình...</div>
        </div>
    </section>

    <section id="tab-settings" class="tab-content w-full max-w-md space-y-4">
        <div class="bg-white p-5 rounded-[2rem] border border-slate-100 shadow-sm space-y-4">
            <h3 class="font-bold text-slate-800 text-xs uppercase flex items-center gap-2">
                <i class="fa-solid fa-microchip text-indigo-500"></i> Quản lý thiết bị
            </h3>
            <button id="btn-show-code" class="w-full py-3 bg-indigo-50 text-indigo-600 rounded-xl font-black text-[10px] border border-indigo-100">XEM MÃ NGUỒN C++</button>
            <button id="btn-reset-wifi" class="w-full py-3 bg-rose-50 text-rose-600 rounded-xl font-black text-[10px] border border-rose-100 uppercase">Cấu hình lại WiFi</button>
        </div>

        <div id="log-box" class="h-40 overflow-y-auto bg-slate-900 rounded-[1.5rem] p-4 text-[9px] font-mono space-y-1 text-slate-300 shadow-inner border border-slate-800">
            <div class="text-blue-400">> Khởi tạo hệ thống...</div>
        </div>
    </section>

    <div id="code-modal" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-[100] hidden flex flex-col p-4">
        <div class="flex justify-between items-center mb-4 text-white">
            <h2 class="font-black text-xs uppercase">ESP32-C3 Full Source Code</h2>
            <div class="flex gap-2">
                <button id="btn-copy-code" class="px-4 py-2 bg-blue-600 rounded-xl text-[10px] font-bold">SAO CHÉP</button>
                <button id="btn-close-code" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>
        <pre id="code-display" class="flex-1 bg-slate-950 border border-white/10 rounded-3xl p-4 overflow-auto text-emerald-400 text-[10px] font-mono leading-relaxed"></pre>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-xl border-t border-slate-100 flex justify-around items-center py-3 px-6 z-[80]">
        <button onclick="window.showTab('control')" id="nav-control" class="nav-item active flex flex-col items-center gap-1">
            <i class="fa-solid fa-grip-vertical text-lg"></i>
            <span class="text-[8px] font-black uppercase tracking-widest">Thiết bị</span>
        </button>
        <button onclick="window.showTab('schedule')" id="nav-schedule" class="nav-item flex flex-col items-center gap-1 text-slate-400">
            <i class="fa-solid fa-calendar-day text-lg"></i>
            <span class="text-[8px] font-black uppercase tracking-widest">Hẹn giờ</span>
        </button>
        <button onclick="window.showTab('settings')" id="nav-settings" class="nav-item flex flex-col items-center gap-1 text-slate-400">
            <i class="fa-solid fa-sliders text-lg"></i>
            <span class="text-[8px] font-black uppercase tracking-widest">Cấu hình</span>
        </button>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, updateDoc, onSnapshot, collection, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBSJwS5xFjXAczjBmVx1gvhMCiZFqKHFYU",
            authDomain: "gemini-55ab8.firebaseapp.com",
            projectId: "gemini-55ab8",
            storageBucket: "gemini-55ab8.firebasestorage.app",
            messagingSenderId: "947388739159",
            appId: "1:947388739159:web:5ee13bd985eaacb7a73d12"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = "gemini-55ab8";
        const devIds = ["relay1", "relay2", "relay3", "relay4"];

        window.showTab = (id) => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => {
                n.classList.remove('active');
                n.classList.add('text-slate-400');
            });
            document.getElementById(`tab-${id}`).classList.add('active');
            const navBtn = document.getElementById(`nav-${id}`);
            navBtn.classList.add('active');
            navBtn.classList.remove('text-slate-400');
        };

        const addLog = (msg, type = "info") => {
            const box = document.getElementById('log-box');
            const entry = document.createElement('div');
            entry.className = type === "success" ? "text-emerald-400" : type === "error" ? "text-rose-400" : "text-slate-400";
            entry.innerHTML = `<span class="text-slate-600">[${new Date().toLocaleTimeString()}]</span> ${msg}`;
            box.appendChild(entry);
            box.scrollTop = box.scrollHeight;
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                addLog("Xác thực Firebase thành công.", "success");
                initApp();
            } else {
                signInAnonymously(auth).catch(err => addLog("Auth Error: " + err.message, "error"));
            }
        });

        function initApp() {
            const list = document.getElementById('device-list');
            list.innerHTML = ''; 

            devIds.forEach((id, index) => {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'devices', id);
                const card = document.createElement('div');
                card.className = "bg-white p-2 py-4 rounded-[1.5rem] flex flex-col items-center gap-2 border border-slate-100 shadow-sm relative overflow-hidden";
                card.innerHTML = `
                    <div id="icon-${id}" class="w-8 h-8 rounded-xl bg-slate-50 flex items-center justify-center text-slate-300 transition-all duration-300"><i class="fa-solid fa-bolt text-[10px]"></i></div>
                    <span class="font-black text-slate-700 text-[8px] uppercase tracking-tighter text-center">Thiết bị ${index+1}</span>
                    <button id="toggle-${id}" class="w-full py-2 rounded-xl bg-slate-50 relative overflow-hidden border border-slate-100">
                        <div id="bg-fill-${id}" class="absolute inset-0 bg-blue-600 translate-y-full transition-transform duration-500"></div>
                        <span id="label-${id}" class="relative z-10 text-[8px] font-black text-slate-400 uppercase">Tắt</span>
                    </button>
                `;
                list.appendChild(card);

                onSnapshot(docRef, (snap) => {
                    if(!snap.exists()) return;
                    const status = snap.data().status;
                    const fill = document.getElementById(`bg-fill-${id}`);
                    const label = document.getElementById(`label-${id}`);
                    const icon = document.getElementById(`icon-${id}`);
                    
                    fill.style.transform = status ? 'translateY(0)' : 'translateY(100%)';
                    label.innerText = status ? 'Bật' : 'Tắt';
                    label.className = `relative z-10 text-[8px] font-black uppercase ${status ? 'text-white' : 'text-slate-400'}`;
                    icon.className = `w-8 h-8 rounded-xl flex items-center justify-center transition-all duration-500 ${status ? 'bg-blue-100 text-blue-600 scale-110 shadow-lg shadow-blue-200' : 'bg-slate-50 text-slate-300'}`;

                    document.getElementById(`toggle-${id}`).onclick = () => {
                        updateDoc(docRef, { status: !status });
                        addLog(`TB ${index+1} -> ${!status ? 'BẬT' : 'TẮT'}`, "info");
                    };
                });
            });
            trackConnection();
        }

        function trackConnection() {
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');
            const badge = document.getElementById('status-badge');
            
            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'system', 'status'), (snap) => {
                if (snap.exists()) {
                    const lastSeen = snap.data().last_seen || 0;
                    const diff = Date.now() - lastSeen;
                    if (diff < 45000) {
                        dot.className = "w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse";
                        text.innerText = "TRỰC TUYẾN";
                        badge.className = "flex items-center gap-2 px-3 py-1.5 rounded-full bg-white text-emerald-600 text-[9px] font-black border border-emerald-100 shadow-sm transition-all duration-500";
                    } else {
                        dot.className = "w-1.5 h-1.5 rounded-full bg-rose-500";
                        text.innerText = "NGOẠI TUYẾN";
                        badge.className = "flex items-center gap-2 px-3 py-1.5 rounded-full bg-white text-rose-500 text-[9px] font-black border border-rose-100 shadow-sm transition-all duration-500";
                    }
                }
            });
        }

        document.getElementById('btn-reset-wifi').onclick = async () => {
            const confirmed = window.confirm("Xóa cấu hình WiFi trên ESP32? Thiết bị sẽ khởi động lại và phát mạng 'ESP32-C3-Config'.");
            if(confirmed) {
                try {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'system', 'commands'), { reset_wifi: true }, { merge: true });
                    addLog("Đã gửi lệnh Reset WiFi.", "success");
                } catch (e) { addLog("Lỗi: " + e.message, "error"); }
            }
        };

        const fullCppCode = `/* 
 * MA NGUON ESP32-C3 SMART HOME AI - PHIEN BAN HOAN THIEN
 * Dieukhien 4 Relay, 4 Nut nhan, Heartbeat, Reset WiFi
 */
#include <Arduino.h>
#include <WiFi.h>
#include <WiFiManager.h> 
#include <Firebase_ESP_Client.h>
#include <addons/TokenHelper.h>

// --- THONG TIN FIREBASE ---
#define FIREBASE_PROJECT_ID "gemini-55ab8"
#define FIREBASE_API_KEY "AIzaSyBSJwS5xFjXAczjBmVx1gvhMCiZFqKHFYU"

// --- CAU HINH CHAN GPIO ---
const int relayPins[] = {1, 2, 3, 4};       // Relay: GPIO 1, 2, 3, 4
const int buttonPins[] = {5, 6, 7, 10};    // Nut nhan: GPIO 5, 6, 7, 10
const int statusLed = 8;                   // LED bao hieu: GPIO 8
const char* deviceIds[] = {"relay1", "relay2", "relay3", "relay4"};

bool relayStates[] = {false, false, false, false};
int lastBtnState[] = {HIGH, HIGH, HIGH, HIGH};
unsigned long lastDebounce[] = {0, 0, 0, 0};

FirebaseData fbdo;
FirebaseAuth auth;
FirebaseConfig config;
WiFiManager wm; // FIX: Dua wm ra toan cuc de loop() su dung duoc

void blinkLed() {
    digitalWrite(statusLed, HIGH); delay(100); digitalWrite(statusLed, LOW);
}

void setup() {
    Serial.begin(115200);
    pinMode(statusLed, OUTPUT);
    for(int i=0; i<4; i++) {
        pinMode(relayPins[i], OUTPUT);
        digitalWrite(relayPins[i], LOW);
        pinMode(buttonPins[i], INPUT_PULLUP);
    }
    
    // Tu dong ket noi hoac phat AP cau hinh
    wm.autoConnect("ESP32-C3-Config", "12345678");
    WiFi.mode(WIFI_STA); 
    
    // Dong bo gio NTP
    configTime(7 * 3600, 0, "pool.ntp.org", "time.nist.gov");
    struct tm timeinfo;
    while(!getLocalTime(&timeinfo)) { delay(500); Serial.print("."); }

    config.api_key = FIREBASE_API_KEY;
    Firebase.signUp(&config, &auth, "", "");
    Firebase.begin(&config, &auth);
    Firebase.reconnectWiFi(true);
    
    for(int i=0; i<3; i++) { blinkLed(); delay(100); }
    Serial.println("--- HE THONG SAN SANG ---");
}

void loop() {
    if (Firebase.ready()) {
        // 1. Heartbeat Online (Moi 15 giay)
        static unsigned long lastHb = 0;
        if (millis() - lastHb > 15000) {
            lastHb = millis();
            time_t now = time(nullptr);
            unsigned long long nowMs = (unsigned long long)now * 1000;
            String path = "artifacts/gemini-55ab8/public/data/system/status";
            String content = "{\\"fields\\":{\\"last_seen\\":{\\"integerValue\\":\\"" + String(nowMs) + "\\"}}}";
            Firebase.Firestore.patchDocument(&fbdo, FIREBASE_PROJECT_ID, "", path.c_str(), content.c_str(), "last_seen");
        }

        // 2. Kiem tra Lenh Reset WiFi tu Web
        static unsigned long lastCmdCheck = 0;
        if (millis() - lastCmdCheck > 5000) {
            lastCmdCheck = millis();
            String cmdPath = "artifacts/gemini-55ab8/public/data/system/commands";
            if (Firebase.Firestore.getDocument(&fbdo, FIREBASE_PROJECT_ID, "", cmdPath.c_str(), "")) {
                if (fbdo.payload().indexOf("\\"reset_wifi\\":{\\"booleanValue\\":true}") > 0) {
                    Serial.println(">>> NHAN LENH RESET WIFI!");
                    Firebase.Firestore.patchDocument(&fbdo, FIREBASE_PROJECT_ID, "", cmdPath.c_str(), "{\\"fields\\":{\\"reset_wifi\\":{\\"booleanValue\\":false}}}", "reset_wifi");
                    delay(1000); 
                    wm.resetSettings(); // Bay gio wm da hop le
                    ESP.restart();
                }
            }
        }

        // 3. Nut nhan vat ly
        for(int i=0; i<4; i++) {
            int reading = digitalRead(buttonPins[i]);
            if (reading != lastBtnState[i]) lastDebounce[i] = millis();
            if ((millis() - lastDebounce[i]) > 50) {
                if (reading == LOW && lastBtnState[i] == HIGH) {
                    relayStates[i] = !relayStates[i];
                    digitalWrite(relayPins[i], relayStates[i] ? HIGH : LOW);
                    String path = "artifacts/gemini-55ab8/public/data/devices/" + String(deviceIds[i]);
                    String content = "{\\"fields\\":{\\"status\\":{\\"booleanValue\\":" + String(relayStates[i] ? "true" : "false") + "}}}";
                    Firebase.Firestore.patchDocument(&fbdo, FIREBASE_PROJECT_ID, "", path.c_str(), content.c_str(), "status");
                    blinkLed();
                }
            }
            lastBtnState[i] = reading;
        }

        // 4. Lenh tu Web (Moi 2 giay)
        static unsigned long lastSync = 0;
        if(millis() - lastSync > 2000) {
            lastSync = millis();
            for(int i=0; i<4; i++) {
                String path = "artifacts/gemini-55ab8/public/data/devices/" + String(deviceIds[i]);
                if (Firebase.Firestore.getDocument(&fbdo, FIREBASE_PROJECT_ID, "", path.c_str(), "")) {
                    bool cloudState = fbdo.payload().indexOf("\\"booleanValue\\":true") > 0;
                    if(cloudState != relayStates[i]) {
                        relayStates[i] = cloudState;
                        digitalWrite(relayPins[i], relayStates[i] ? HIGH : LOW);
                        blinkLed();
                    }
                }
            }
        }
    }
}`;

        document.getElementById('btn-show-code').onclick = () => {
            document.getElementById('code-display').innerText = fullCppCode;
            document.getElementById('code-modal').classList.remove('hidden');
        };
        document.getElementById('btn-close-code').onclick = () => document.getElementById('code-modal').classList.add('hidden');
        document.getElementById('btn-copy-code').onclick = () => {
            const el = document.createElement('textarea');
            el.value = fullCppCode;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            alert("Đã sao chép mã nguồn!");
        };
    </script>
</body>
</html>
